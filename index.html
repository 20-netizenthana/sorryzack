<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ถึงพี่แซ็ค 💗</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(135deg, #ffe6ef, #fff5f8);
  overflow: hidden;
}

.card {
  width: 90%;
  max-width: 420px;
  padding: 40px 25px;
  text-align: center;
  background: rgba(255,255,255,.85);
  border-radius: 30px;
  box-shadow: 0 15px 50px rgba(255,100,150,.25);
  backdrop-filter: blur(10px);
  animation: pop .8s ease;
  position: relative;
}

.heart {
  font-size: 85px;
  animation: beat 1s infinite;
  display: inline-block;
}

h1 {
  color: #ff4f87;
  margin: 15px 0 10px;
  font-size: 28px;
}

p {
  color: #555;
  font-size: 17px;
  line-height: 1.7;
  margin-bottom: 20px;
}

.btn-group {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 15px;
  min-height: 50px;
  position: relative;
}

button {
  border: none;
  padding: 12px 24px;
  border-radius: 999px;
  font-size: 16px;
  cursor: pointer;
  transition: all .2s ease;
}

.btn-yes {
  background: #ff5c91;
  color: white;
  box-shadow: 0 8px 20px rgba(255,92,145,.35);
  font-weight: bold;
}

.btn-yes:hover {
  transform: scale(1.08);
  background: #ff407d;
}

.btn-no {
  background: #f0f0f0;
  color: #777;
  position: absolute;
  white-space: nowrap;
}

.floating {
  position: absolute;
  bottom: -30px;
  font-size: 25px;
  animation: float 5s linear infinite;
  opacity: .7;
  pointer-events: none;
}

@keyframes beat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}

@keyframes pop {
  from { transform: scale(.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes float {
  from { transform: translateY(0) rotate(0deg); opacity: 0; }
  20% { opacity: .8; }
  to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}
</style>
</head>

<body>

<div class="card">
  <div class="heart">🥺</div>

  <h1>ถึงพี่แซ็ค...</h1>

  <p>
    ไม่อยากให้พี่แซ็คเสียใจเลย<br>
    เค้าขอโทษนะครับ 😭<br>
    อย่าเพิ่งงอนเค้านานเลยน้า
  </p>

  <p>
    ถึงเค้าจะเป็นเด็กไอที 🤓💻<br>
    แต่เรื่องง้อพี่ เค้าตั้งใจเขียนสุดๆ เลยนะ!
  </p>

  <div class="btn-group">
    <button class="btn-yes" onclick="forgive()">ให้อภัยเค้านะ 💗</button>
    <button class="btn-no" id="btnNo" onmouseover="runAway()" onclick="runAway()">ไม่ให้อภัย 😤</button>
  </div>
</div>

<script>
// ปุ่มไม่ยกโทษวิ่งหนี
function runAway() {
  const btnNo = document.getElementById("btnNo");
  const card = document.querySelector(".card");
  
  const cardRect = card.getBoundingClientRect();
  const btnRect = btnNo.getBoundingClientRect();

  const maxX = cardRect.width - btnRect.width - 20;
  const maxY = cardRect.height - btnRect.height - 20;

  const randomX = Math.random() * maxX - (cardRect.width / 2 - btnRect.width / 2);
  const randomY = Math.random() * maxY - (cardRect.height / 2 - btnRect.height / 2);

  btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
}

// เมื่อกดให้อภัย
function forgive() {
  const message = encodeURIComponent("เค้ายกโทษให้แล้วน้าาา 🥰💗 ไม่อยากทะเลาะกันแล้วเหมือนกัน!");

  document.querySelector(".card").innerHTML = `
    <div class="heart">💖</div>
    <h1>เย้ๆๆๆ! 🎉💗</h1>
    <p>
      ขอบคุณที่ยกโทษให้เค้านนะ<br>
      เค้ารักพี่แซ็คที่สุดเลย! 🥰<br>
      ไม่อยากทะเลาะกันอีกแล้ว
    </p>
    <p>กำลังเปิด LINE... 📲✨</p>
  `;

  for(let i = 0; i < 40; i++) {
    setTimeout(createHeart, i * 50);
  }

  // เปิด LINE อัตโนมัติหลังกด 1.2 วินาที
  setTimeout(() => {
    window.location.href = `https://line.me/R/msg/text/?${message}`;
  }, 1200);
}

// สร้างหัวใจลอย background
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "floating";
  const icons = ["💗", "💖", "💕", "🌸", "✨"];
  heart.innerHTML = icons[Math.floor(Math.random() * icons.length)];
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (3 + Math.random() * 3) + "s";
  heart.style.fontSize = (20 + Math.random() * 20) + "px";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 6000);
}

setInterval(createHeart, 600);
</script>

</body>
</html>
